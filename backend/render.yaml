services:
  - type: web
    name: ai-expense-tracker-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: https://celqwclvswspldqarvbs.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TRAINING_API_KEY
        value: super-secret-training-key
      - key: MODELS_DIR
        value: models
